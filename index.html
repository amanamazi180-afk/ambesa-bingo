<script>
/* ===== ONLY THING TO EDIT: your Worker address ===== */
const API=(new URLSearchParams(location.search).get("api")||"https://YOUR-WORKER.workers.dev").replace(/\/$/,"");

const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#0c0805");tg.setBackgroundColor("#0c0805")}catch(e){}}

const WD={cbe:"CBE",telebirr:"Telebirr",boa:"BOA",mpesa:"M-Pesa",ebirr:"E-birr",dashen:"Dashen",oromia:"Oromia",awash:"Awash"};
const ERR={not_registered:"መጀመሪያ በቦቱ ይመዝገቡ (ስልክ ቁጥርዎን ያጋሩ)",insufficient_balance:"በቂ ሒሳብ የለዎትም - ገቢ ያድርጉ",round_closed:"ዙሩ ጀምሯል",max_cards:"ከ2 ካርቴላ በላይ አይቻልም",taken:"ካርቴላው ተይዟል",bad_input:"ያስገቡትን ያረጋግጡ",too_many_pending:"ብዙ ያልተረጋገጡ ጥያቄዎች አሉ",txid_used:"ይህ የግብይት ቁጥር ተጠቅሟል",deposit_required:"ከማውጣትዎ በፊት ገቢ ያድርጉ",unauthorized:"ጨዋታውን ከቴሌግራም ቦት ይክፈቱ",server_error:"የሰርቨር ችግር፣ እንደገና ይሞክሩ",banned:"አካውንትዎ ታግዷል",paused:"ጨዋታው ቆሟል",locked:"🔒 ይህ ዙር ተቆልፏል",no_bingo:"❌ ገና ቢንጎ የለም",round_over:"ዙሩ አብቅቷል"};
let S=null,off=0,inGame=false,looping=false,reg=false,pend=0,rid=0,lastN=0,key="",gkey="",SH=new Set(),snd=true,touched=false,q=[],busy=false,wonId=0,endT={id:0,t:0};
const F=n=>String(+Number(n).toFixed(2)),Lt=n=>"BINGO"[Math.floor((n-1)/15)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let _t;function toast(m,ok){const t=$("toast");t.textContent=m;t.style.background=ok?"var(--gr)":"var(--cr)";t.style.display="block";clearTimeout(_t);_t=setTimeout(()=>t.style.display="none",2800)}
function show(id){document.querySelectorAll(".s").forEach(e=>e.classList.remove("on"));$(id).classList.add("on");$("gnav").style.display=id==="game"?"none":"flex";if(id!=="game")stopVoice()}
function initData(){let d=tg&&tg.initData||"";if(!d){try{d=new URLSearchParams(location.hash.slice(1)).get("tgWebAppData")||""}catch(e){}}return d}
async function api(p,b){if(API.indexOf("YOUR-")>=0)throw"no_api";const tries=b?1:3;for(let a=0;a<tries;a++){const c=new AbortController(),to=setTimeout(()=>c.abort(),10000);try{const r=await fetch(API+p,{method:b?"POST":"GET",headers:{"content-type":"application/json","x-init-data":initData()},body:b?JSON.stringify(b):undefined,signal:c.signal}),d=await r.json().catch(()=>({}));if(!r.ok)throw d.error||"server_error";return d}catch(e){const er=typeof e==="string"?e:"server_error";if(er==="server_error"&&a<tries-1){await sleep(600*(a+1));continue}throw er}finally{clearTimeout(to)}}}
/* cards: same generator as the server */
function mk(no){let s=no*7919+13;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296,cols=[];for(let c=0;c<5;c++){const p=Array.from({length:15},(_,i)=>c*15+i+1),o=[];for(let i=0;i<5;i++)o.push(p.splice(Math.floor(r()*p.length),1)[0]);cols.push(o)}cols[2][2]=0;return cols}

/* voice: every call is spoken in order; the number appears on screen when its voice starts */

let warmed=0;function warm(){if(warmed)return;warmed=1;const c=navigator.connection;if(c&&(c.saveData||/(^|-)2g/.test(c.effectiveType||"")))return;let i=0;const step=()=>{if(i>75)return;const u=(i?i:"bingo")+".m4a";i++;fetch(u).catch(()=>{}).finally(()=>setTimeout(step,350))};setTimeout(step,2500)}

/* flow */
async function boot(){for(let a=0;a<4;a++){try{const[me,st]=await Promise.all([api("/api/me"),api("/api/state")]);reg=me.registered;S=st;off=st.now-Date.now();goHome(me);return}catch(e){if(typeof e==="string"&&e!=="server_error"){$("hreg").textContent=ERR[e]||(e==="no_api"?"የWorker አድራሻ በindex.html ያስገቡ":e);return}$("hreg").textContent="እንደገና በመገናኘት ላይ…";await sleep(1500)}}$("hreg").innerHTML='መገናኘት አልተቻለም <button class="gb" onclick="boot()">⟳</button>'}
async function goHome(me){inGame=false;show("home");try{me=me||await api("/api/me");reg=me.registered;$("hw").textContent=F(me.balance+me.bonus)+" ብር"}catch(e){}$("hreg").textContent=reg?"":"መጀመሪያ ይመዝገቡ፦ ቦቱን ከፍተው ስልክ ቁጥርዎን ያጋሩ";if(S)$("hs").textContent=S.round.stake}
function play(){if(!reg){toast(ERR.not_registered);return}touched=true;inGame=true;key="";gkey="";if(S)render();if(!looping)loop();else tick()}
function gap(){if(document.hidden)return 4000;const r=S.round,t=Date.now()+off;if(r.status==="lobby"){const l=r.start_ts+r.lobby_ms-t;return l<=0?600:Math.min(2000,l+300)}if(r.status==="running"){const nx=r.start_ts+r.lobby_ms+S.called.length*r.call_ms-t;return Math.max(500,Math.min(4000,nx+350))}return 1500}
async function loop(){looping=true;while(inGame){await tick();await sleep(S?gap():1500)}looping=false}
setInterval(()=>{if(inGame&&S&&S.round.status==="lobby"&&pend===0)drawLobby()},1000);
async function tick(){if(pend>0)return;try{const s=await api("/api/state");if(pend>0)return;S=s;off=S.now-Date.now();if(inGame)render()}catch(e){if(e==="not_registered"||e==="unauthorized"){inGame=false;toast(ERR[e]);goHome()}}}
function render(){const r=S.round;if(r.id!==rid){rid=r.id;lastN=S.called.length;key="";gkey="";stopVoice();SH=new Set(S.called)}if(r.status==="lobby"){$("win").classList.remove("on");show("lobby");drawLobby()}else{show("game");drawGame()}}
const bi=()=>(S&&S.bround)||{locked:false,wins:[]};
function drawLobby(){const r=S.round,left=Math.max(0,Math.ceil((r.start_ts+r.lobby_ms-(Date.now()+off))/1000));$("lt").textContent=left+"s";$("lm").textContent=F(S.balance);$("lp").textContent=F(S.bonus);$("ls").textContent=r.stake;$("lder").textContent=F(S.taken.length*r.stake*0.8);$("lpl").textContent=S.taken.length;
const bw=bi().wins||[],k=JSON.stringify([S.taken,S.mine,bw]);if(k===key)return;key=k;const b=$("bnr");if(bw.length){b.innerHTML=bw.map(w=>"🎉 "+esc(w.name)+"! "+F(w.amount)+" ብር ቦነስ · ካርቴላ #"+w.cartela).join("<br>");b.style.display="block"}else{b.innerHTML="";b.style.display="none"}
const gold=new Set(bw.map(w=>w.cartela)),M=new Set(S.mine),T=new Set(S.taken),cells=$("grid").children;for(let i=0;i<CARDS;i++){const n=i+1,c="n"+(gold.has(n)?" bn":M.has(n)?" mine":T.has(n)?" tk":"");if(cells[i].className!==c)cells[i].className=c}$("prev").innerHTML=S.mine.map(n=>`<div><div class="cn">ካርቴላ #${n}</div>${cardHTML(n,[])}</div>`).join("")}
async function pick(n){if(S.taken.includes(n)&&!S.mine.includes(n))return;const had=S.mine.includes(n);if(had&&bi().locked){toast(ERR.locked);return}if(!had&&S.mine.length>=2){toast(ERR.max_cards);return}const bk=[S.mine.slice(),S.taken.slice()];
if(had){S.mine=S.mine.filter(x=>x!==n);S.taken=S.taken.filter(x=>x!==n)}else{S.mine.push(n);S.taken.push(n)}key="";drawLobby();pend++;
try{const s=await api(had?"/api/unpick":"/api/pick",{cartela:n});if(s.bonus_won)toast("🎉 "+F(s.bonus_won)+" ብር ቦነስ አሸንፈዋል!",1);if(pend===1){S=s;key="";render()}if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged()}
catch(e){if(e==="server_error"){try{const s2=await api("/api/state");if(s2.mine.includes(n)===!had){if(pend===1){S=s2;key="";render()}return}const s3=await api(had?"/api/unpick":"/api/pick",{cartela:n});if(pend===1){S=s3;key="";render()}return}catch(x){e=x}}if(pend===1){S.mine=bk[0];S.taken=bk[1];key="";drawLobby()}toast(ERR[e]||e)}finally{pend--;if(pend===0)tick()}}
async function backHome(){inGame=false;if(bi().locked)toast("🔒 ካርቴላዎ ተቆልፏል");else for(const n of S.mine.slice()){try{await api("/api/unpick",{cartela:n})}catch(e){}}goHome()}
function leaveGame(){inGame=false;$("win").classList.remove("on");goHome()}
function buildGrid(){let h="";for(let i=1;i<=CARDS;i++)h+=`<div class="n" data-n="${i}">${i}</div>`;const g=$("grid");g.innerHTML=h;g.addEventListener("click",e=>{const t=e.target.closest(".n");if(t)pick(+t.dataset.n)})}
function buildBoard(){let h="";for(let i=0;i<5;i++){h+=`<div class="hd" style="background:${CL[i]}">${"BINGO"[i]}</div>`;for(let k=1;k<=15;k++){const n=i*15+k;h+=`<div class="nn" id="b${n}">${n}</div>`}}$("board").innerHTML=h}
function drawGame(){const r=S.round,all=S.called;$("gid").textContent=r.id;$("gp").textContent=S.taken.length||S.cards||0;$("gbet").textContent=r.stake;$("gd").textContent=F(S.derash);
if(all.length>lastN){const run=r.status==="running",f=Math.max(lastN,all.length-3);for(let i=lastN;i<all.length;i++){if(run&&snd&&i>=f)playNum(all[i]);else SH.add(all[i])}lastN=all.length}
const cl=all.filter(x=>SH.has(x)),n=cl[cl.length-1];$("gc").textContent=cl.length;const gk=r.id+"|"+cl.length+"|"+S.mine.join(",");
if(gk!==gkey){gkey=gk;const bg=$("big");bg.textContent=n?Lt(n)+"-"+n:"—";if(n){bg.classList.remove("new");void bg.offsetWidth;bg.classList.add("new")}
for(let i=1;i<=75;i++)$("b"+i).className="nn"+(i===n?" l":cl.includes(i)?" k":"");$("rec").innerHTML=cl.slice(-3).reverse().map(x=>`<span style="background:${CL[Math.floor((x-1)/15)]}">${Lt(x)}-${x}</span>`).join("");
$("mycards").innerHTML=S.mine.length?S.mine.map(c=>`<div class="mc"><div class="cn">ካርቴላ #${c}</div>${cardHTML(c,cl,null,n)}</div>`).join(""):'<div style="text-align:center;padding:24px"><b style="font-size:19px">እየተመለከቱ ነው</b><p class="hint" style="margin-top:8px">ቀጣዩ ዙር በቅርቡ ይጀምራል።</p></div>'}
const ab=$("act");$("sw").className="sw"+(S.auto?"":" off");
if(!S.mine.length){ab.textContent="እየተመለከቱ ነው";ab.disabled=true;ab.className="gb"}else if(S.auto){ab.textContent="አውቶማቲክ";ab.disabled=true;ab.className="gb g"}else{ab.textContent="ቢንጎ!";ab.disabled=false;ab.className="gb r"}
const ov=$("win");if(r.status==="ended"||r.status==="cancelled"){if(r.status==="ended"){if(endT.id!==r.id){endT.id=r.id;endT.t=Date.now()}if((busy||q.length)&&Date.now()-endT.t<8000)return;all.forEach(x=>SH.add(x))}
const sec=Math.max(0,Math.ceil((r.rest_ms-(Date.now()+off-r.ended_ts))/1000));ov.classList.add("on");
if(r.status==="ended"){const w=S.winners,me=w.some(x=>S.mine.includes(x.cartela));if(wonId!==r.id){wonId=r.id;winSound()}$("wb2").style.display="block";$("wt").textContent=me?"🎉 አሸንፈዋል!":"🏆 አሸናፊ";$("wn").textContent=w.map(x=>x.name).join(", ")+" · "+F(S.derash/(w.length||1))+" ብር";$("wc").innerHTML=w.length?`<div class="cn">ካርቴላ #${w[0].cartela}</div>`+cardHTML(w[0].cartela,all,winLine(mk(w[0].cartela),all)):""}
else{$("wb2").style.display="none";$("wt").textContent="ዙሩ ተሰርዟል";$("wn").textContent="በቂ ተጫዋች የለም። ዋጋዎ ተመልሷል።";$("wc").innerHTML=""}$("ws").textContent="ቀጣይ ዙር በ"+sec+" ሰከንድ"}else ov.classList.remove("on")}
async function toggleAuto(){const a=!S.auto;S.auto=a;drawGame();try{await api("/api/auto",{auto:a})}catch(e){S.auto=!a;drawGame();toast(ERR[e]||e)}}
async function claim(){try{S=await api("/api/bingo",{});off=S.now-Date.now();render()}catch(e){toast(ERR[e]||e)}}
/* tabs */
function tabTo(i){inGame=false;$("win").classList.remove("on");document.querySelectorAll("#gnav div").forEach((d,k)=>d.classList.toggle("on",k===i));if(i===0){goHome();return}show("tab");$("tabc").innerHTML='<p class="hint">…</p>';i===1?rankPage("weekly"):walletPage("d")}
let bank="cbe",wb="cbe";
async function walletPage(t){try{const me=await api("/api/me");const dpt=t==="d";const L=dpt?Object.keys(BANKS).map(k=>`<div class="mth ${k===bank?"on":""}" onclick="bank='${k}';walletPage('d')"><i style="background:${BANKS[k][2]}">${BANKS[k][0][0]}</i><div style="flex:1"><b>${BANKS[k][0]} · ${HOLDER}</b><span>${BANKS[k][1]}</span></div><button class="gb g" onclick="event.stopPropagation();cp('${BANKS[k][1]}')">COPY</button></div>`).join(""):Object.keys(WD).map(k=>`<div class="mth ${k===wb?"on":""}" onclick="wb='${k}';walletPage('w')"><b>${WD[k]}</b></div>`).join("");
$("tabc").innerHTML=`<div class="li"><span>ዋና ቦርሳ</span><span>${F(me.balance)} ብር</span></div><div class="li"><span>ቦነስ (ለጨዋታ)</span><span>${F(me.bonus)}</span></div><div class="row"><button class="gb ${dpt?"g":""}" style="flex:1" onclick="walletPage('d')">ገቢ አድርግ</button><button class="gb ${dpt?"":"g"}" style="flex:1" onclick="walletPage('w')">ወጪ አድርግ</button></div>${L}`+(dpt?`<input class="inp" id="fa1" type="number" inputmode="numeric" placeholder="መጠን (ቢያንስ 30 ብር)"><input class="inp" id="fa2" placeholder="የግብይት ቁጥር"><button class="gb g" onclick="dep()">ገቢውን አስገባ</button>`:`<input class="inp" id="fa2" placeholder="የሂሳብ ቁጥር / ስልክ"><input class="inp" id="fa1" type="number" inputmode="numeric" placeholder="መጠን (ቢያንስ 50 ብር)"><button class="gb g" onclick="wd()">ወጪ ጠይቅ</button>`)+me.withdrawals.map(x=>`<div class="li"><span>ወጪ ${F(x.amount)}</span><span>${x.status}</span></div>`).join("")}catch(e){toast(ERR[e]||e)}}
async function dep(){try{const d=await api("/api/deposit",{amount:$("fa1").value,txid:$("fa2").value,method:bank});toast(d.status==="approved"?"✅ ገቢው ደርሷል":"✅ ተልኳል። ሲረጋገጥ ይጨመራል",1);walletPage("d")}catch(e){toast(ERR[e]||e)}}
async function wd(){try{await api("/api/withdraw",{amount:$("fa1").value,account:$("fa2").value,method:wb});toast("✅ የወጪ ጥያቄ ተልኳል",1);walletPage("w")}catch(e){toast(ERR[e]||e)}}
function cp(t){try{navigator.clipboard.writeText(t);toast("✅ ተቀድቷል "+t,1)}catch(e){toast(t)}}
async function rankPage(p){try{const d=await api("/api/leaderboard?period="+p),tabs=`<div class="row"><button class="gb ${p==="weekly"?"g":""}" style="flex:1" onclick="rankPage('weekly')">ሳምንታዊ</button><button class="gb ${p==="daily"?"g":""}" style="flex:1" onclick="rankPage('daily')">ዕለታዊ</button></div>`,me=d.me||{};
const rows=p==="weekly"?(d.top||[]).map(x=>`<div class="rk"><div class="no">${x.rank}</div><div class="in"><b>${esc(x.name)}</b><br><small>${esc(x.phone)} · ${x.games} ጨዋታ</small></div><b style="color:var(--gd)">${x.prize>0?F(x.prize)+" ብር":""}</b></div>`):(d.top||[]).map((r,i)=>`<div class="rk"><div class="no">${i+1}</div><div class="in"><b>${esc(r[0])}</b></div><small>${r[1]} ጨዋታ</small></div>`);
$("tabc").innerHTML=tabs+`<div class="li"><span>የእኔ ደረጃ</span><span>${me.rank?"#"+me.rank:"—"} · ${me.played||0} ጨዋታ</span></div>`+(rows.join("")||'<p class="hint" style="padding:16px">ገና ማንም አልተጫወተም</p>')}catch(e){toast(ERR[e]||e)}}
buildBoard();buildGrid();boot();
</script></body></html>
