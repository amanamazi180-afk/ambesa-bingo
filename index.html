.dp{background:var(--gd);color:#241500;border:0;border-radius:24px;padding:12px 16px;font-weight:900}
.ban{background:linear-gradient(90deg,#7a1020,#c1121f);border-radius:18px;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.ban b{font-size:17px}.ban small{display:block;color:#ffd7b0;margin-top:3px}
.tabs{display:flex;gap:8px;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:8px;margin-bottom:10px;overflow-x:auto}
.tabs b{flex:none;padding:11px 16px;border-radius:12px;color:var(--mu);font-weight:700}.tabs b.on{background:linear-gradient(90deg,#7a1020,#c1121f);color:#fff}
.sr{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font-size:16px;margin-bottom:10px}
h2{font-size:21px;margin:12px 0 10px}
.g{display:grid;grid-template-columns:1fr;gap:14px}
.t{text-align:center;font-weight:800;font-size:17px}.t i{display:block;aspect-ratio:2/1;border-radius:18px;font-style:normal;font-size:0;margin-bottom:6px;position:relative;border:1px solid #ffffff22;overflow:hidden}
.t i b{position:absolute;font-size:13px;bottom:6px;left:0;right:0;font-weight:900;text-shadow:0 1px 4px #000}.t em{position:absolute;top:6px;right:6px;font-style:normal;background:#000a;color:var(--gd);font-size:10px;padding:2px 6px;border-radius:8px}
.nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;background:#1a110a;border:1px solid var(--ln);border-radius:26px;padding:6px;z-index:5}
.nav div{flex:1;text-align:center;padding:8px 0;border-radius:20px;font-size:12px;font-weight:700;color:var(--mu)}.nav div span{display:block;font-size:20px}.nav div.on{background:#3b2a17;color:var(--gd)}

const GAMES=[
 {n:"Aviator",c:"crash",bg:"url("+IMG_AV+") center/cover",u:"aviator.html"},
 {n:"አንበሳ Bingo",c:"bingo",bg:"url("+IMG_BG+") center/62% no-repeat,linear-gradient(160deg,#f2b632,#8a4b00)",u:"bingo.html"}];
let cat="all";
function draw(){const q=$("sr").value.trim().toLowerCase();$("g").innerHTML=GAMES.filter(g=>(cat==="all"||g.c===cat)&&g.n.toLowerCase().includes(q)).map((g,i)=>`<div class="t" data-i="${GAMES.indexOf(g)}"><i style="background:${g.bg}"></i>${g.n}</div>`).join("")||'<p style="color:var(--mu);">ጨዋታ አልተገኘም</p>'}
$("g").onclick=e=>{const t=e.target.closest(".t");if(!t)return;const g=GAMES[+t.dataset.i];g.u?go(g.u):toast("በቅርቡ ይመጣል 🔜")};
$("tabs").onclick=e=>{const b=e.target.closest("b");if(!b)return;cat=b.dataset.c;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));draw()};
$("sr").oninput=draw;
function go(u){location.href=u}
let _t;function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(_t);_t=setTimeout(()=>t.style.display="none",2200)}
/* balance: shown as **** until the eye is pressed */
let bal=null,show=false;
function initData(){let d=tg&&tg.initData||"";if(!d){try{d=new URLSearchParams(location.hash.slice(1)).get("tgWebAppData")||""}catch(e){}}return d}
function paint(){$("bv").textContent=show&&bal!=null?bal.toFixed(2)+" ETB":"****"}
async function load(){try{const r=await fetch(API+"/api/me",{headers:{"x-init-data":initData()},cache:"no-store"}),d=await r.json();if(typeof d.balance==="number"){bal=d.balance;paint()}else if(d.error==="unauthorized")toast("ከቴሌግራም ቦት ይክፈቱ")}catch(e){}}
$("eye").onclick=()=>{show=!show;paint()};$("rf").onclick=()=>{load();toast("⟳")};
draw();load();setTimeout(()=>$("splash").classList.add("out"),1500);
</script></body></html>
